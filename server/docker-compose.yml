services:
  postgres:
    image: postgres:16-alpine
    container_name: mc-nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: mc_nexus
    ports:
      - "5432:5432"
    volumes:
      - mc_nexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d mc_nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional cache — enable when you turn on Redis-backed sessions/queues.
  redis:
    image: redis:7-alpine
    container_name: mc-nexus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mc_nexus_redisdata:/data

volumes:
  mc_nexus_pgdata:
  mc_nexus_redisdata:
